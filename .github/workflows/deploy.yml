name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            ./web/package-lock.json
            ./admin/package-lock.json

      - name: Build storefront (web)
        working-directory: ./web
        run: |
          npm ci
          npm run predeploy

      - name: Build admin (admin)
        working-directory: ./admin
        run: |
          npm ci
          npm run predeploy

      - name: Merge admin into web dist
        run: |
          mkdir -p web/dist/admin
          cp -r admin/dist/. web/dist/admin/
          cp admin/dist/index.html web/dist/admin/404.html

      - name: Delete stale github-pages artifact
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const run_id = context.runId;
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({ owner, repo, run_id });
            for (const artifact of data.artifacts) {
              if (artifact.name === 'github-pages') {
                await github.rest.actions.deleteArtifact({ owner, repo, artifact_id: artifact.id });
                core.info(`Deleted stale artifact ${artifact.name} (id ${artifact.id})`);
              }
            }

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4